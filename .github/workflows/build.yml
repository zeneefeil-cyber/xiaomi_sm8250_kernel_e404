name: Build E404 Kernel (Alioth)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            python3 zip curl make ccache build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/kvsnr113/AnyKernel3 ../AnyKernel3

      - name: Download LLVM 22.1.4
        run: |
          mkdir -p ../toolchains/llvm-clang
          curl -Lo clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/LLVM-22.1.4-Linux-X64.tar.xz
          tar -xf clang.tar.xz --strip-components=1 -C ../toolchains/llvm-clang
          rm clang.tar.xz

      - name: Build and patch kptools from source
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KPatch-Next kpatch-src
          cp kpatch-src/kernel/include/preset.h kpatch-src/tools/
          
          echo ">>> ORIGINAL patch.c (around bad rela) <<<"
          grep -n -B2 -A2 "bad rela" kpatch-src/tools/patch.c
          
          echo ">>> PATCHING KPTOOLS TO IGNORE BSS RELOCS <<<"
          # Ищем "bad rela offset", захватываем следующую строку (где return) и меняем на continue;
          sed -i '/bad rela offset/{N;s/return [^;]*;/continue;/}' kpatch-src/tools/patch.c
          
          echo ">>> MODIFIED patch.c (around bad rela) <<<"
          grep -n -B2 -A2 "bad rela" kpatch-src/tools/patch.c
          
          make -C kpatch-src/tools -j$(nproc)
          cp kpatch-src/tools/kptools ./kptools
          chmod +x kptools

      - name: Download kpimg
        run: |
          curl -Lo kpimg \
            https://github.com/KernelSU-Next/KPatch-Next/releases/download/0.13.5-2/kpimg-linux

      - name: Create Telegram config
        run: |
          cat > ../telegram_api << 'EOF'
          BOT_TOKEN=fake
          GROUP_ID=-1
          CHANNEL_ID=-1
          PRIVATE_ID=-1
          EOF

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ../ccache
          key: ccache-alioth-${{ github.sha }}
          restore-keys: ccache-alioth-

      - name: Build kernel with config injection
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          cat << 'EOF' > $GITHUB_WORKSPACE/bin/make
          #!/bin/bash
          if [[ "$*" == *"defconfig"* && "$*" != *"olddefconfig"* ]]; then
            /usr/bin/make "$@"
            
            CONF="out/.config"
            [ -f ".config" ] && CONF=".config"
            
            if [ -f "$CONF" ]; then
              # Выключаем LTO
              sed -i 's/CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/' "$CONF"
              sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' "$CONF"
              sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/' "$CONF"
              
              # Включаем KALLSYMS и KPROBES
              sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' "$CONF"
              sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' "$CONF"
              
              echo 'CONFIG_LTO_NONE=y' >> "$CONF"
              echo 'CONFIG_KALLSYMS=y' >> "$CONF"
              echo 'CONFIG_KPROBES=y' >> "$CONF"
              
              ARGS=()
              for arg in "$@"; do
                if [[ "$arg" != *"defconfig"* ]]; then
                  ARGS+=("$arg")
                fi
              done
              
              /usr/bin/make "${ARGS[@]}" olddefconfig
              
              echo ">>> VERIFYING KERNEL CONFIGS <<<"
              grep -E 'CONFIG_KALLSYMS|CONFIG_LTO|CONFIG_KPROBES' "$CONF"
              echo ">>> END OF VERIFICATION <<<"
            fi
          else
            /usr/bin/make "$@"
          fi
          EOF
          
          chmod +x $GITHUB_WORKSPACE/bin/make
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"

          chmod +x compile.sh
          ./compile.sh alioth llvm

      - name: Patch kernel Image with KPM
        run: |
          IMAGE="out/arch/arm64/boot/Image"

          # Паддинг больше не нужен, так как kptools теперь просто проигнорирует выход за пределы файла
          ./kptools -p \
            -i "$IMAGE" \
            -k kpimg \
            -o "${IMAGE}.patched" \
            -M ci/ditpro.kpm \
            -V pre-kernel-init \
            -T kpm

          if [ $? -ne 0 ]; then
            echo "kptools patch failed"
            exit 1
          fi

          ZIP=$(ls out/RE404-*.zip | head -1)
          cp "${IMAGE}.patched" "../AnyKernel3/ALIOTH-Image"
          
          cd ../AnyKernel3
          zip -u "${GITHUB_WORKSPACE}/${ZIP}" ALIOTH-Image
          cd "${GITHUB_WORKSPACE}"
          echo "KPM embedded OK"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: E404-Alioth-KPM-${{ github.run_number }}
          path: out/RE404-*.zip

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/kernel_compile.log
