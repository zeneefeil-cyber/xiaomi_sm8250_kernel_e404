name: Build E404 Kernel (Alioth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Patch defconfig
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/alioth_defconfig"

          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y/' "$DEFCONFIG"
          grep -q 'CONFIG_KALLSYMS_ALL' "$DEFCONFIG" || echo 'CONFIG_KALLSYMS_ALL=y' >> "$DEFCONFIG"

          sed -i 's/CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/' "$DEFCONFIG"
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' "$DEFCONFIG"
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/' "$DEFCONFIG"
          sed -i 's/# CONFIG_LTO_NONE is not set/CONFIG_LTO_NONE=y/' "$DEFCONFIG"

          grep -E 'KALLSYMS|RANDOMIZE_BASE|RELOCATABLE|LTO' "$DEFCONFIG"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            python3 zip curl make ccache cmake build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/kvsnr113/AnyKernel3 ../AnyKernel3

      - name: Download LLVM 22.1.4
        run: |
          mkdir -p ../toolchains/llvm-clang
          curl -Lo clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/LLVM-22.1.4-Linux-X64.tar.xz
          tar -xf clang.tar.xz --strip-components=1 -C ../toolchains/llvm-clang
          rm clang.tar.xz

      - name: Build patched kptools from source
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KPatch-Next kpatch-src

          # Патч: заменяем проверку границ image_size → kernel_size
          # чтобы BSS-записи в rela таблице не пропускались
          grep -n "bad rela offset\|image_size" kpatch-src/tools/patch.c | head -20

          sed -i 's/kimg->image_size/kimg->kernel_size/g' kpatch-src/tools/patch.c

          echo "--- Patched lines ---"
          grep -n "kernel_size\|image_size" kpatch-src/tools/patch.c | head -20

          # Сборка
          cd kpatch-src
          if [ -f CMakeLists.txt ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j$(nproc)
            find build -name "kptools*" -type f | head -5
            cp $(find build -name "kptools" -type f | head -1) ../kptools
          else
            make -C tools -j$(nproc) || make -j$(nproc)
            cp kptools ../kptools 2>/dev/null || find . -name "kptools" | head -1 | xargs -I{} cp {} ../kptools
          fi

          cd ..
          chmod +x kptools
          ./kptools --version

      - name: Download kpimg
        run: |
          curl -Lo kpimg \
            https://github.com/KernelSU-Next/KPatch-Next/releases/download/0.13.5-2/kpimg-linux

      - name: Create Telegram config
        run: |
          cat > ../telegram_api << 'EOF'
          BOT_TOKEN=fake
          GROUP_ID=-1
          CHANNEL_ID=-1
          PRIVATE_ID=-1
          EOF

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ../ccache
          key: ccache-alioth-${{ github.sha }}
          restore-keys: ccache-alioth-

      - name: Build kernel
        run: |
          chmod +x compile.sh
          ./compile.sh alioth llvm

      - name: Patch kernel Image with KPM
        run: |
          IMAGE="out/arch/arm64/boot/Image"
          cp "$IMAGE" "${IMAGE}.ori"

          ./kptools -p \
            -i "${IMAGE}.ori" \
            -k kpimg \
            -o "${IMAGE}.patched" \
            -M ci/ditpro.kpm \
            -V pre-kernel-init \
            -T kpm

          if [ $? -ne 0 ]; then
            echo "kptools patch failed"
            exit 1
          fi

          # Заменяем Image в AnyKernel3 zip на пропатченный
          ZIP=$(ls out/RE404-*.zip | head -1)
          cp "${IMAGE}.patched" "../AnyKernel3/ALIOTH-Image"
          cd ../AnyKernel3
          zip -u "${GITHUB_WORKSPACE}/${ZIP}" ALIOTH-Image
          cd "${GITHUB_WORKSPACE}"

          echo "KPM embedded OK"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: E404-Alioth-KPM-${{ github.run_number }}
          path: out/RE404-*.zip

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/kernel_compile.log
